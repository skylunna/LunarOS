[package]
name = "lunar-kernel"
version = "0.1.0"
edition = "2021"
authors = ["LunarOS Contributors"]
description = "LunarOS 内核 - 用 Rust 编写的开源操作系统"
license = "MIT"

[[bin]]
name = "lunar-kernel"
path = "src/main.rs"

[lib]
name = "lunar_kernel"
path = "src/lib.rs"

[dependencies]
bootloader = { version = "0.11", features = ["map_physical_memory"] }
uart_16550 = "0.3"
x86_64 = "0.15"
spin = "0.9"
lazy_static = { version = "1.5", features = ["spin_no_std"] }

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.bootimage]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33
